plugins {
    id 'com.android.application'
}

android {
    // Identificativo storico (era "Studio Quiz"): non va cambiato, altrimenti
    // Android tratta l'app come diversa e non la aggiorna sopra le versioni installate.
    namespace 'io.github.m1ke324.studioquiz'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.m1ke324.studioquiz'
        minSdk 26
        targetSdk 36
        // In CI: VERSION_CODE = numero della run, VERSION_NAME = tag (es. 1.2.0)
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName(System.getenv('VERSION_NAME') ?: '1.0.0')
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.18.0'
}

// Copia il sito (radice del repository) negli asset dell'app prima di ogni build.
def copyWeb = tasks.register('copyWeb', Sync) {
    from(rootProject.file('..')) {
        include 'index.html', 'style.css', 'app.webmanifest', 'icon.svg', 'js/**', 'fonts/**'
    }
    into file('src/main/assets/www')
}
tasks.named('preBuild') { dependsOn copyWeb }
