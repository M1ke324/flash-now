name: APK Android

# Crea l'APK e lo pubblica come Release quando si fa push di un tag "v*" (es. v1.0.0).
# Avviato a mano (workflow_dispatch) crea solo l'APK come artifact della run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.9.2

      - name: Versione
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::Secret KEYSTORE_BASE64 mancante: l'APK viene firmato con una chiave di debug temporanea (non si potrà aggiornare sopra le versioni precedenti)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compila
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/StudioQuiz-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: StudioQuiz-${{ env.VERSION_NAME }}
          path: dist/*.apk

      - name: Pubblica la Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "Studio $VERSION_NAME" \
            --notes "App Android di Studio · Quiz e Flashcard.

          **Installazione:** scarica \`StudioQuiz-${VERSION_NAME}.apk\` dal telefono e aprilo. La prima volta Android chiede di consentire l'installazione da questa fonte (browser o file manager).

          L'app mostra il sito https://m1ke324.github.io/studio-quiz/: i nuovi mazzi compaiono senza aggiornare l'APK. Serve una connessione internet."
